<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kiwiapply 🥝 本地面板</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262b36;--tx:#e8eaf0;--dim:#9aa3b2;--acc:#4ade80;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC",sans-serif;padding:20px}
h1{font-size:19px;margin-bottom:4px} .sub{color:var(--dim);font-size:12px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{font-size:22px;display:block} .stat span{color:var(--dim);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
button,select,input{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--acc)} button.primary{background:var(--acc);color:#08210f;border:none;font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px;background:#141821}
td a{color:var(--blue);text-decoration:none} .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line)}
.p-new{color:var(--dim)} .p-shortlisted{color:var(--warn);border-color:var(--warn)} .p-applied{color:var(--acc);border-color:var(--acc)} .p-blocked{color:var(--bad);border-color:var(--bad)} .p-ignored{opacity:.5}
#toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--acc);padding:10px 16px;border-radius:10px;display:none}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:460px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.6)} label{display:block;color:var(--dim);font-size:12px;margin:10px 0 4px}
input[type=text],input[type=email]{width:100%;cursor:text}
.sec{margin:22px 0 10px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<h1>kiwiapply 🥝 本地面板</h1>
<div class="sub">数据只存本机 data/ 目录 · 服务只监听 127.0.0.1 · 关闭服务即无任何网络暴露</div>

<div class="bar">
  <button class="primary" onclick="scanNow()">⟳ 扫描新岗位</button>
  <select id="fStatus" onchange="loadJobs()"><option value="">全部状态</option><option value="new">未处理</option><option value="shortlisted">已收藏</option><option value="applied">已投递</option><option value="blocked">受阻</option><option value="ignored">已忽略</option></select>
  <select id="fChannel" onchange="loadJobs()"><option value="">全部渠道</option><option value="seek">SEEK</option><option value="trademe">Trade Me</option><option value="skykiwi">天维网</option><option value="indeed_nz">Indeed</option></select>
  <input type="text" id="fQ" placeholder="搜索标题/公司…" style="min-width:160px;cursor:text" onkeydown="if(event.key==='Enter')loadJobs()">
  <button onclick="loadJobs()">筛选</button>
  <button onclick="openSetup()">⚙ 资料与简历</button>
</div>

<div class="grid" id="stats"></div>
<div class="sec">岗位 <span id="jobCount" style="color:var(--dim);font-weight:400"></span></div>
<table><thead><tr><th>岗位</th><th>公司</th><th>地点/薪资</th><th>渠道</th><th>状态</th><th>操作</th></tr></thead><tbody id="jobs"></tbody></table>

<dialog id="cardDlg">
  <div style="display:flex;justify-content:space-between;align-items:start">
    <b id="c_title" style="font-size:15px"></b>
    <button onclick="cardDlg.close()" style="border:none;background:none">✕</button>
  </div>
  <div id="c_meta" style="color:var(--dim);font-size:12px;margin:4px 0 10px"></div>
  <div style="font-size:12px;margin-bottom:8px">ATS：<b id="c_ats" style="color:var(--acc)"></b> <span id="c_pill"></span></div>
  <div id="c_tip" style="background:#141821;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;margin-bottom:10px"></div>
  <div class="bar"><a id="c_open" href="#" target="_blank"><button class="primary">打开申请页 ↗</button></a>
  <button onclick="copyPrompt()">复制 agent 指令</button></div>
  <details id="c_plugin_wrap"><summary style="cursor:pointer;color:var(--dim);font-size:12px">ATS 避坑手册（agent 或人读）</summary>
  <pre id="c_plugin" style="white-space:pre-wrap;font-size:11px;color:var(--dim);margin-top:8px;max-height:260px;overflow:auto"></pre></details>
</dialog>
<dialog id="setup">
  <b>个人资料（全部只存本机 SQLite）</b>
  <label>姓名</label><input type="text" id="p_name">
  <label>邮箱</label><input type="email" id="p_email">
  <label>电话</label><input type="text" id="p_phone">
  <label>工作权利（答案映射用）</label><input type="text" id="p_workrights">
  <div class="sec" style="margin-top:14px">简历（按岗位类型分版）</div>
  <label>岗位类型</label>
  <select id="cv_role"><option>general</option><option>retail_seasonal</option><option>administration</option><option>student_services</option><option>edtech</option></select>
  <input type="file" id="cv_file" accept=".pdf,.doc,.docx" style="margin-top:6px;width:100%">
  <button onclick="uploadCv()" style="margin-top:8px">上传</button>
  <div id="cvList" style="margin-top:10px;font-size:12px;color:var(--dim)"></div>
  <div class="bar" style="margin-top:14px"><button class="primary" onclick="saveSetup()">保存</button><button onclick="setup.close()">关闭</button></div>
</dialog>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
async function api(p,opt){const r=await fetch(p,opt);return r.json()}

async function loadStats(){
  const s=await api('/api/stats');
  const st=s.jobs_by_status||{}, ch=s.jobs_by_channel||{}, ap=s.applications||{};
  const total=Object.values(st).reduce((a,b)=>a+b,0);
  $('#stats').innerHTML=[
    ['岗位总数',total],['未处理',st.new||0],['已收藏',st.shortlisted||0],['已投递',st.applied||0],
    ['投递成功',ap.sent||0],['受阻',ap.blocked||0]
  ].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('')+
  Object.entries(ch).map(([k,v])=>`<div class="stat"><b style="font-size:16px">${v}</b><span>${k}</span></div>`).join('');
}
async function loadJobs(){
  const p=new URLSearchParams();
  if($('#fStatus').value)p.set('status',$('#fStatus').value);
  if($('#fChannel').value)p.set('channel',$('#fChannel').value);
  if($('#fQ').value)p.set('q',$('#fQ').value);
  const jobs=await api('/api/jobs?'+p);
  $('#jobCount').textContent='('+jobs.length+')';
  $('#jobs').innerHTML=jobs.map(j=>{
    const x=JSON.parse(j.extra||'{}');
    const contact=x.contact_email?`<div style="font-size:11px;color:var(--warn)">✉ ${esc(x.contact_email)} ${esc(x.contact_phone||'')}</div>`:'';
    return `<tr>
    <td><a href="${esc(j.url)}" target="_blank">${esc(j.title)}</a><div style="font-size:11px;color:var(--dim)">${esc(j.listed||'')} · 收录 ${esc((j.first_seen||'').slice(0,16))}</div>${contact}</td>
    <td>${esc(j.company)}</td><td>${esc(j.location)}<div style="font-size:11px;color:var(--dim)">${esc(j.salary||'')}</div></td>
    <td>${esc(j.channel)}</td>
    <td><span class="pill p-${j.status}">${j.status}</span></td>
    <td style="white-space:nowrap">
      <button onclick="setSt('${j.id}','${j.channel}','shortlisted')" title="收藏">★</button>
      <button onclick="openCard('${j.id}','${j.channel}')" title="投递卡片">🎯</button>
      <button onclick="markApplied('${j.id}','${j.channel}')" title="标记已投">✓投</button>
      ${j.channel==='skykiwi'&&!contact?`<button onclick="enrichOne('${j.id}','${esc(j.url)}')" title="提取帖内邮箱电话">☎</button>`:''}
      <button onclick="setSt('${j.id}','${j.channel}','ignored')" title="忽略">✕</button>
    </td></tr>`}).join('');
}
async function setSt(id,ch,status){await api('/api/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,channel:ch,status})});loadStats();loadJobs()}
async function markApplied(id,ch){
  const conf=prompt('回执号/confirmation（可留空）')||'';
  await api('/api/apply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({job:{id,channel:ch},result:'sent',confirmation:conf})});
  toast('已记录投递');loadStats();loadJobs();
}
async function enrichOne(id,url){
  const r=await api('/api/enrich',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,channel:'skykiwi',url})});
  toast(r.email?('联系: '+r.email+' '+r.phone):'帖内未找到邮箱/电话');loadJobs();
}
async function scanNow(){toast('扫描已启动（约10秒）');await api('/api/scan',{method:'POST'});setTimeout(()=>{loadStats();loadJobs()},12000)}
let lastPrompt='';
async function openCard(id,ch){
  const d=await api('/api/ats?id='+encodeURIComponent(id)+'&channel='+encodeURIComponent(ch));
  const j=d.job||{};
  $('#c_title').textContent=j.title||id;
  $('#c_meta').textContent=(j.company||'')+' · '+(j.location||'')+' · '+(j.salary||'')+' · '+(j.channel||ch);
  $('#c_ats').textContent=d.ats;
  $('#c_pill').innerHTML=d.has_plugin?'<span class="pill p-applied">有插件知识</span>':'<span class="pill p-new">无插件（通用流程）</span>';
  $('#c_tip').textContent=d.tip||'';
  $('#c_open').href=j.url||'#';
  $('#c_plugin').textContent=d.plugin_text||'（无）';
  $('#c_plugin_wrap').style.display=d.plugin_text?'':'none';
  lastPrompt=d.agent_prompt||'';
  cardDlg.showModal();
}
async function copyPrompt(){
  try{await navigator.clipboard.writeText(lastPrompt);toast('agent 指令已复制，粘给你的 AI agent 即可执行')}
  catch(e){prompt('手动复制：',lastPrompt)}
}
async function openSetup(){
  const p=await api('/api/profile');
  $('#p_name').value=p.name||'';$('#p_email').value=p.email||'';$('#p_phone').value=p.phone||'';$('#p_workrights').value=p.workrights||'';
  const cvs=await api('/api/cv');
  $('#cvList').innerHTML=cvs.length?cvs.map(c=>`📄 ${esc(c.role_type)} — ${esc(c.filename)}`).join('<br>'):'尚未上传简历';
  setup.showModal();
  if(!(p.name&&p.email))toast('第一次使用：请先填写资料并上传简历');
}
async function saveSetup(){
  await api('/api/profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('#p_name').value,email:$('#p_email').value,phone:$('#p_phone').value,workrights:$('#p_workrights').value})});
  toast('资料已保存到本机');loadStats();
}
async function uploadCv(){
  const f=$('#cv_file').files[0];if(!f){toast('先选择文件');return}
  const fd=new FormData();fd.append('role_type',$('#cv_role').value);fd.append('cv',f);
  const r=await api('/api/cv',{method:'POST',body:fd});
  toast(r.ok?'简历已上传到本机 data/uploads/':'上传失败:'+JSON.stringify(r));
  openSetup();
}
loadStats();loadJobs();
fetch('/api/onboarded').then(r=>r.json()).then(o=>{if(!o.onboarded)setTimeout(openSetup,600)});
</script>
</body>
</html>
